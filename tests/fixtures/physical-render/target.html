<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guideo local render fixture</title>
    <style>
      body { background: #101828; color: #f8fafc; font: 18px/1.5 system-ui, sans-serif; margin: 0; }
      main { display: grid; gap: 1rem; margin: 12vh auto; max-width: 42rem; padding: 2rem; }
      button { background: #7c3aed; border: 0; border-radius: .5rem; color: white; font: inherit; padding: .75rem 1rem; width: fit-content; }
      #status { color: #a7f3d0; min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Local render fixture</h1>
      <p>This deterministic page replaces authenticated SauceDemo flows during physical render validation.</p>
      <button id="continue" type="button">Continue</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <script>
      document.querySelector("#continue").addEventListener("click", () => {
        document.querySelector("#status").textContent = "Fixture interaction completed.";
      });
    </script>
  </body>
</html>
